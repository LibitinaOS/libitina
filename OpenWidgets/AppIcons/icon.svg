<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
>
  <defs>
    <!-- background -->
    <linearGradient id="bgPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF33BB"/>
      <stop offset="100%" stop-color="#CC0088"/>
    </linearGradient>

    <!-- panels -->
    <linearGradient id="panelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2F8"/>
      <stop offset="100%" stop-color="#FFD6EC"/>
    </linearGradient>

    <linearGradient id="panelMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB3DD"/>
      <stop offset="100%" stop-color="#FF80C8"/>
    </linearGradient>

    <linearGradient id="panelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff64b9"/>
      <stop offset="100%" stop-color="#ff43ae"/>
    </linearGradient>
  </defs>

  <!-- outer container: 4px @ 48 → ~42.7px -->
  <rect
    x="0"
    y="0"
    width="512"
    height="512"
    rx="42.67"
    fill="url(#bgPink)"
  />

  <!-- left widget: 2px @ 48 → ~21.3px -->
  <rect
    x="56"
    y="56"
    width="184"
    height="400"
    rx="21.33"
    fill="url(#panelLight)"
  />

  <!-- right top widget -->
  <rect
    x="264"
    y="56"
    width="192"
    height="176"
    rx="21.33"
    fill="url(#panelMid)"
  />

  <!-- right bottom widget -->
  <rect
    x="264"
    y="256"
    width="192"
    height="200"
    rx="21.33"
    fill="url(#panelDark)"
  />
</svg>
